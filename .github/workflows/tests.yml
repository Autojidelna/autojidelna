name: '[Flutter] Tests'

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-check:
    name: PR Validation
    runs-on: blacksmith-2vcpu-ubuntu-2204
    if: github.event_name == 'pull_request'
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPO_OWNER: ${{ github.repository_owner }}
      REPO_NAME: ${{ github.repository.split('/')[1] }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      valid: ${{ steps.branch-check.outputs.valid }}
    steps:
      - uses: actions/checkout@v4

      - name: Check branch name
        id: branch-check
        run: |
          if [[ ! ${{ github.event.pull_request.head.ref }} =~ ^([0-9]+\.[0-9]+\.[0-9]+|.*patch.*)$ ]]; then
            echo "Branch name does not match pattern."
            echo "valid=false" >> $GITHUB_OUTPUT
          else
            echo "Branch name is valid."
            echo "valid=true" >> $GITHUB_OUTPUT
          fi

      - name: Set comment body
        id: comment-body
        run: |
          if [ "${{ steps.branch-check.outputs.valid }}" == "false" ]; then
            echo "body=${{ vars.COMMENT_CLOSED }}" >> $GITHUB_OUTPUT
          else
            echo "body=${{ vars.COMMENT_NICE }}" >> $GITHUB_OUTPUT
          fi

      - name: Check if comment exists
        id: comment-check
        run: |
          COMMENT_BODY="${{ steps.comment-body.outputs.body }}"

          COMMENTS=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/$REPO_OWNER/$REPO_NAME/issues/$PR_NUMBER/comments")

          if echo "$COMMENTS" | grep -q "$COMMENT_BODY"; then
            echo "Comment already exists."
            echo "comment_exists=true" >> $GITHUB_OUTPUT
          else
            echo "Comment does not exist."
            echo "comment_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Comment on PR
        if: steps.comment-check.outputs.comment_exists == 'false'
        run: |
          COMMENT_BODY="${{ steps.comment-body.outputs.body }}"

          curl -s -H "Authorization: token $GITHUB_TOKEN" \
            -X POST \
            -d "{\"body\":\"$COMMENT_BODY\"}" \
            "https://api.github.com/repos/$REPO_OWNER/$REPO_NAME/issues/$PR_NUMBER/comments"

      - name: Close PR
        if: steps.branch-check.outputs.valid == 'false' && steps.comment-check.outputs.comment_exists == 'false'
        run: |
          curl -s -H "Authorization: token $GITHUB_TOKEN" \
            -X PATCH \
            -d "{\"state\":\"closed\"}" \
            "https://api.github.com/repos/$REPO_OWNER/$REPO_NAME/pulls/$PR_NUMBER"
          exit 1

  filter:
    runs-on: blacksmith-2vcpu-ubuntu-2204
    needs: pr-check
    if: ${{ always() }}
    outputs:
      should_run: ${{ steps.run-tests.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4

      - name: Changed files filter
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            android:
              - 'android/**'
            ios:
              - 'ios/**'
            lib:
              - 'lib/**'
              - 'pubspec.yaml'
            test:
              - 'test/**'
              - 'analysis_options.yaml'

      - name: Unify filter outputs
        id: run-tests
        run: |
          if [[ "${{ steps.filter.outputs.android }}" == "true" || \
          "${{ steps.filter.outputs.ios }}" == "true" || \
          "${{ steps.filter.outputs.lib }}" == "true" || \
          "${{ steps.filter.outputs.test }}" == "true" ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

  flutter-tests:
    name: Flutter Tests
    runs-on: blacksmith-4vcpu-ubuntu-2204
    needs: filter
    if: needs.filter.outputs.should_run == 'true' || github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ vars.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test
