name: Scheduled FCM Messages

on:
  workflow_dispatch:
  schedule:
    - cron: '45 8 * * *' # Every day at 8:45 UTC (10:45 in Prague)
    - cron: '45 15 * * 0,1,2,3,6' # Thursday and Friday at 15:45 UTC (17:45 in Prague)

jobs:
  send_messages:
    runs-on: blacksmith-2vcpu-ubuntu-2204
    environment: scheduled-fcm
    steps:
      - name: Authenticate
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/account.json
          gcloud auth activate-service-account --key-file=/tmp/account.json

      - name: Get access token
        id: get_token
        run: echo "token=$(gcloud auth print-access-token)" >> $GITHUB_OUTPUT

      - name: Send FCM messages
        env:
          ACCESS_TOKEN: ${{ steps.get_token.outputs.token }}
          PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          send_message() {
            local topic="$1"
            curl -X POST "https://fcm.googleapis.com/v1/projects/${PROJECT_ID}/messages:send" \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "Content-Type: application/json; UTF-8" \
              -d '{
                "message": {
                  "priority": "high",
                  "topic": "'"${topic}"'",
                  "data": { "type": "'"${topic}"'" },
                  "apns": {
                    "headers": { "apns-priority": "10" },
                    "payload": { "aps": { "content-available": 1 } }
                  }
                }
              }'
            echo -e "\n✅ Sent '${topic}' message"
          }

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            send_message "food_today"
            send_message "low_credit"
            send_message "next_week_food_check"

          elif [[ "$SCHEDULE" == "45 8 * * *" ]]; then
            send_message "food_today"

          elif [[ "$SCHEDULE" == "45 15 * * 0,1,2,3,6" ]]; then
            send_message "low_credit"
            send_message "next_week_food_check"
          fi
