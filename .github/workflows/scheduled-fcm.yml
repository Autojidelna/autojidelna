        run: echo "token=$(gcloud auth print-access-token)" >> $GITHUB_OUTPUT
      
      - name: Send FCM message
        env:
          ACCESS_TOKEN: ${{ steps.get_token.outputs.token }}
          PROJECT_ID: autojidelna-be937
        run: |
          curl -X POST "https://fcm.googleapis.com/v1/projects/${PROJECT_ID}/messages:send" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json; UTF-8" \
            -d '{
              "message": {
                "topic": "low_credit_1500",
                "data": {
                  "type": "low_credit"
                },
                "android": {"priority": "high"},
                "apns": {
                  "headers": {"apns-priority": "10"},
                  "payload": {"aps": {"content-available": 1}}
                }
              }
            }'

  next_week_food_check_1500:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 15 * * *')
    runs-on: ubuntu-latest
    environment: scheduled-fcm
    steps:
      - name: Authenticate
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/account.json
          gcloud auth activate-service-account --key-file=/tmp/account.json
      
      - name: Get access token
        id: get_token
        run: echo "token=$(gcloud auth print-access-token)" >> $GITHUB_OUTPUT
      
      - name: Send FCM message
        env:
          ACCESS_TOKEN: ${{ steps.get_token.outputs.token }}
          PROJECT_ID: autojidelna-be937
        run: |
          curl -X POST "https://fcm.googleapis.com/v1/projects/${PROJECT_ID}/messages:send" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json; UTF-8" \
            -d '{
              "message": {
                "topic": "next_week_food_check_1500",
                "data": {
                  "type": "next_week_food_check"
                },
                "android": {"priority": "high"},
                "apns": {
                  "headers": {"apns-priority": "10"},
                  "payload": {"aps": {"content-available": 1}}
                }
              }
            }'
